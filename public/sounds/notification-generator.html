<!DOCTYPE html>
<html>
<head>
    <title>Generate Notification Sound</title>
</head>
<body>
    <h1>Notification Sound Generator</h1>
    <button onclick="generateAndDownload()">Generate & Download notification.mp3</button>
    <button onclick="playPreview()">Preview Sound</button>

    <script>
        // Generate a pleasant notification sound
        async function generateNotificationSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const sampleRate = audioContext.sampleRate;
            const duration = 5.0; // 5 seconds
            const numSamples = sampleRate * duration;

            const audioBuffer = audioContext.createBuffer(1, numSamples, sampleRate);
            const channelData = audioBuffer.getChannelData(0);

            // Create a beautiful notification melody
            // Musical notes: C5, E5, G5, C6 (major chord progression)
            const melody = [
                { freq: 523.25, start: 0.0, duration: 0.8 },    // C5
                { freq: 659.25, start: 0.8, duration: 0.8 },    // E5
                { freq: 783.99, start: 1.6, duration: 0.8 },    // G5
                { freq: 1046.50, start: 2.4, duration: 1.6 },   // C6
            ];

            for (let i = 0; i < numSamples; i++) {
                const t = i / sampleRate;
                let value = 0;

                // Play each note in the melody
                melody.forEach((note) => {
                    if (t >= note.start && t < note.start + note.duration) {
                        const noteTime = t - note.start;

                        // Smooth attack and decay envelope
                        const attackTime = 0.05;
                        const releaseTime = 0.3;
                        let envelope = 1.0;

                        if (noteTime < attackTime) {
                            envelope = noteTime / attackTime;
                        } else if (noteTime > note.duration - releaseTime) {
                            envelope = (note.duration - noteTime) / releaseTime;
                        }

                        // Add harmonic richness
                        const fundamental = Math.sin(2 * Math.PI * note.freq * noteTime);
                        const overtone = Math.sin(2 * Math.PI * note.freq * 2 * noteTime) * 0.1;

                        value += (fundamental + overtone) * envelope * 0.3;
                    }
                });

                // Add reverb tail
                if (t > 4.0) {
                    const reverbTime = t - 4.0;
                    const reverbDecay = Math.exp(-4 * reverbTime);
                    value += Math.sin(2 * Math.PI * 1046.50 * reverbTime) * reverbDecay * 0.15;
                }

                channelData[i] = Math.max(-1, Math.min(1, value));
            }

            return audioBuffer;
        }

        async function playPreview() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await generateNotificationSound();

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            source.start();
        }

        async function generateAndDownload() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await generateNotificationSound();

            // Convert to WAV format
            const wav = audioBufferToWav(audioBuffer);
            const blob = new Blob([wav], { type: 'audio/wav' });

            // Download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'notification.wav';
            a.click();

            alert('Download started! Rename to notification.mp3 if needed.');
        }

        // Convert AudioBuffer to WAV format
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;

            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;

            const data = [];
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    const sample = buffer.getChannelData(channel)[i];
                    const value = Math.max(-1, Math.min(1, sample));
                    data.push(value < 0 ? value * 0x8000 : value * 0x7FFF);
                }
            }

            const dataLength = data.length * bytesPerSample;
            const buffer_length = 44 + dataLength;
            const view = new DataView(new ArrayBuffer(buffer_length));

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, buffer_length - 8, true);
            writeString(view, 8, 'WAVE');

            // FMT sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);

            // Data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            let offset = 44;
            for (let i = 0; i < data.length; i++) {
                view.setInt16(offset, data[i], true);
                offset += 2;
            }

            return view.buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
